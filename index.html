<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f9ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="JOJO">
    <title>JOJO | Plataforma Educativa</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <style>
        @font-face {
            font-family: "Archivo";
            src: url("./assets/fonts/archivo-latin.woff2") format("woff2");
            font-weight: 500 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Inter";
            src: url("./assets/fonts/inter-latin.woff2") format("woff2");
            font-weight: 400 800;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <link rel="stylesheet" href="./styles/main.css?v=16">
    <link rel="stylesheet" href="./styles/menu.css?v=8">
</head>
<body>
    <div class="app-shell">
        <main class="app-screen">
            <header class="topbar" aria-label="Topo do app">
                <a class="brand-lockup" href="./index.html" aria-label="Início do JOJO">
                    <img class="brand-lockup__logo" src="./assets/jojo-horizontal.svg" alt="JOJO">
                </a>
                <span class="hello-pill">Professor</span>
            </header>

            <section class="hero" aria-labelledby="heroTitle">
                <div class="hero__copy">
                    <h1 id="heroTitle">Olá, Professor!</h1>
                    <p id="heroSub">Aqui está o que você pode fazer hoje.</p>
                </div>
            </section>

            <section class="bento" aria-label="Atividades do JOJO">
                <div id="primaryGrid" class="primary-grid"></div>
                <div id="smallGrid" class="small-grid"></div>
            </section>

            <div class="home-footer">
                <footer class="credit-card" aria-label="Créditos do app">
                    <img src="./assets/logo-profanapixelart-small.webp" alt="">
                    <p><span>Desenvolvido por</span>Ana Clara Silva de Lima</p>
                </footer>
                <button id="installAppBtn" class="install-app-button" type="button" aria-label="Baixar app JOJO" title="Baixar app JOJO" hidden>
                    <img class="install-app-button__icon" src="./assets/JOJOdownloadsemfundo.svg" alt="">
                    <span>Baixar</span>
                </button>
            </div>
        </main>

        <div id="panelBackdrop" class="panel-backdrop hidden"></div>
        <section id="infoPanel" class="info-panel" aria-hidden="true" aria-labelledby="panelTitle">
            <div class="sheet-handle" aria-hidden="true"></div>
            <header class="info-panel__header">
                <div>
                    <p>JOJO</p>
                    <h2 id="panelTitle"></h2>
                </div>
                <button id="panelCloseBtn" class="icon-button" type="button" aria-label="Fechar painel">×</button>
            </header>
            <p id="panelDescription" class="info-panel__description"></p>
            <div id="panelContent" class="info-panel__content"></div>
        </section>

        <nav class="jojo-bottom-nav" aria-label="Navegação principal">
            <button class="jojo-bottom-nav__item is-active" type="button" data-nav="home" aria-label="Início" aria-current="page">
                <img class="jojo-nav-icon" src="./assets/jojo-nav-home.png" alt="" aria-hidden="true">
                <span class="sr-only">Início</span>
            </button>
            <a class="jojo-bottom-nav__item" href="./jogos/index.html" data-nav="jogos" aria-label="Jogos" aria-current="false">
                <img class="jojo-nav-icon" src="./assets/jojo-nav-jogos.png" alt="" aria-hidden="true">
                <span class="sr-only">Jogos</span>
            </a>
            <a class="jojo-bottom-nav__item" href="./jogos/timer/index.html" data-nav="ferramentas" aria-label="Ferramentas" aria-current="false">
                <img class="jojo-nav-icon" src="./assets/jojo-nav-ferramentas.png" alt="" aria-hidden="true">
                <span class="sr-only">Ferramentas</span>
            </a>
        </nav>
    </div>

    <script src="./scripts/data.js?v=9"></script>
    <script src="./scripts/app.js?v=9"></script>
    <script src="./scripts/pwa.js?v=16"></script>
</body>
</html>
