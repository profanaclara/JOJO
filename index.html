    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "Organization",
                    "@id": "https://jojo.profanaclara.com.br/#organization",
                    "name": "JOJO",
                    "url": "https://jojo.profanaclara.com.br/",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "https://jojo.profanaclara.com.br/assets/icon-512.png",
                        "width": 512,
                        "height": 512
                    },
                    "email": "jojo.profanaclara@gmail.com",
                    "founder": {
                        "@type": "Person",
                        "name": "Ana Clara Silva de Lima"
                    }
                },
                {
                    "@type": "WebSite",
                    "@id": "https://jojo.profanaclara.com.br/#website",
                    "name": "JOJO",
                    "alternateName": "JOJO Jogos Educacionais",
                    "url": "https://jojo.profanaclara.com.br/",
                    "inLanguage": "pt-BR",
                    "publisher": { "@id": "https://jojo.profanaclara.com.br/#organization" }
                },
                {
                    "@type": ["WebApplication", "SoftwareApplication"],
                    "@id": "https://jojo.profanaclara.com.br/#app",
                    "name": "JOJO",
                    "url": "https://jojo.profanaclara.com.br/",
                    "applicationCategory": "EducationalApplication",
                    "operatingSystem": "Web",
                    "inLanguage": "pt-BR",
                    "description": "Jogos educacionais e ferramentas para leitura, matemática, fluência, organização do tempo e registros pedagógicos.",
                    "isAccessibleForFree": true,
                    "image": "https://jojo.profanaclara.com.br/assets/jojo-social-share.jpg",
                    "offers": {
                        "@type": "Offer",
                        "price": "0",
                        "priceCurrency": "BRL"
                    },
                    "publisher": { "@id": "https://jojo.profanaclara.com.br/#organization" }
                }
            ]
        }
    </script>
</head>
<body>
    <div class="app-shell">
        <main class="app-screen">
            <header class="brand-hero">
                <img
                    class="brand-hero__logo brand-hero__logo--horizontal"
                    src="./assets/jojo-horizontal.svg"
                    alt="JOJO"
                >
            </header>

            <section class="home-actions" aria-label="Acesso rápido da plataforma">
                <button class="home-action home-action--games" type="button" data-section="games">
                    <img class="home-action__icon home-action__icon--controle" src="./assets/jojo-menu-jogos.png" alt="" aria-hidden="true">
                    <span class="home-action__label">Jogos</span>
                </button>
                <button class="home-action home-action--tools" type="button" data-section="tools">
                    <img class="home-action__icon home-action__icon--cerebro" src="./assets/jojo-menu-ferramentas.png" alt="" aria-hidden="true">
                    <span class="home-action__label">Ferramentas</span>
                </button>
            </section>

            <button id="installAppBtn" class="install-app-button" type="button" aria-label="Baixar app JOJO" title="Baixar app JOJO">
                <img class="install-app-button__icon" src="./assets/JOJOdownloadsemfundo.svg" alt="" aria-hidden="true">
                <span>Baixar App</span>
            </button>

            <footer class="app-footer" aria-label="Créditos da plataforma">
                <img
                    class="app-footer__logo"
                    src="./assets/logo-profanapixelart.png"
                    alt="Logo Ana Clara Silva de Lima"
                >
                <p>Desenvolvido por Ana Clara Silva de Lima</p>
            </footer>

            <aside class="reference-strip" aria-label="Referências pedagógicas">
                <span class="reference-strip__label">Referências</span>
                <div class="reference-strip__logos">
                    <a href="https://abemcomum.org/" target="_blank" rel="noopener noreferrer" aria-label="Associação Bem Comum e SAEV">
                        <img src="./assets/referencia-bem-comum.png" alt="Bem Comum">
                    </a>
                    <a href="https://caed.ufjf.br/" target="_blank" rel="noopener noreferrer" aria-label="CAEd da Universidade Federal de Juiz de Fora">
                        <img src="./assets/referencia-caed-ufjf.png" alt="CAEd UFJF">
                    </a>
                    <a href="https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/saeb" target="_blank" rel="noopener noreferrer" aria-label="Saeb do Inep">
                        <img src="./assets/referencia-saeb.png" alt="Saeb">
                    </a>
                </div>
            </aside>
        </main>

        <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>

        <section
            id="appSheet"
            class="app-sheet"
            aria-hidden="true"
            aria-labelledby="sheetTitle"
        >
            <div class="sheet-handle" aria-hidden="true"></div>

            <header class="sheet-header">
                <div>
                    <p id="sheetEyebrow" class="sheet-header__eyebrow"></p>
                    <h2 id="sheetTitle"></h2>
                </div>
                <button id="sheetCloseBtn" class="icon-button" type="button" aria-label="Fechar painel">×</button>
            </header>

            <div id="sheetTabs" class="sheet-tabs hidden" role="tablist" aria-label="Categorias da seção"></div>
            <div id="sheetContent" class="sheet-content"></div>
        </section>

        <a class="contact-link" href="mailto:jojo.profanaclara@gmail.com" aria-label="Enviar e-mail para contato" title="Contato">
            <span class="contact-link__icon" aria-hidden="true"></span>
        </a>
    </div>

    <script src="./scripts/data.js?v=7"></script>
    <script src="./scripts/app.js?v=2"></script>
    <script src="./scripts/pwa.js?v=17"></script>
</body>
</html>
