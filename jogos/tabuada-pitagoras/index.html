<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#eef8ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="JOJO">
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icon-192.png">
    <link rel="apple-touch-icon" href="../../assets/icon-192.png">
    <title>JOJO | Tabuada de Pitágoras</title>
    <style>
        @font-face {
            font-family: "Archivo";
            src: url("../../assets/fonts/archivo-latin.woff2") format("woff2");
            font-weight: 500 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Inter";
            src: url("../../assets/fonts/inter-latin.woff2") format("woff2");
            font-weight: 400 800;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <link rel="stylesheet" href="./styles.css?v=12">
</head>
<body class="pitagoras-page">
    <div class="pitagoras-shell layout-board">
        <header class="topbar layout-logo">
            <a class="back-button" href="../index.html?eixo=matematica" aria-label="Voltar aos jogos">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
            </a>
            <img class="brand-logo" src="../../assets/jojo-horizontal.svg" alt="JOJO">
            <button id="soundBtn" class="sound-button" type="button" aria-pressed="true" aria-label="Som ligado">
                <img src="../../assets/jojo-som.png" alt="" aria-hidden="true">
            </button>
            <button id="fullscreenBtn" class="fullscreen-button" type="button" aria-label="Tela cheia">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5"/></svg>
            </button>
        </header>

        <main class="game" aria-live="polite">
            <section class="problem-card layout-operation" aria-labelledby="problemTitle">
                <div>
                    <p class="eyebrow">Tabuada de Pitágoras</p>
                    <div id="problemTitle" class="problem-equation" aria-label="Conta de multiplicação">
                        <label class="sr-only" for="factorAInput">Primeiro número</label>
                        <input id="factorAInput" class="number-input number-input--row" type="number" inputmode="numeric" min="1" max="9" placeholder="?" value="">
                        <span aria-hidden="true">×</span>
                        <label class="sr-only" for="factorBInput">Segundo número</label>
                        <input id="factorBInput" class="number-input number-input--column" type="number" inputmode="numeric" min="1" max="9" placeholder="?" value="">
                        <span aria-hidden="true">=</span>
                        <output id="topAnswerValue" class="equation-answer" aria-label="Resultado no topo">?</output>
                    </div>
                </div>
                <div class="problem-actions">
                    <button id="shuffleBtn" class="soft-button icon-soft-button" type="button" aria-label="Trocar operação">
                        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.35-5.65"/><path d="M20 4v5h-5"/></svg>
                    </button>
                    <button id="modeBtn" class="soft-button" type="button" aria-label="Modo automático">Automático</button>
                </div>
            </section>

            <section class="table-panel layout-main" aria-label="Tabuada de Pitágoras">
                <div id="pitagorasGrid" class="pitagoras-grid"></div>
            </section>

            <footer class="game-actions layout-count">
                <button id="clearBtn" class="soft-button" type="button">Limpar</button>
                <button id="showBtn" class="soft-button soft-button--primary" type="button">Mostrar</button>
                <p id="statusText" class="result-text">Escolha os dois números.</p>
            </footer>
        </main>
    </div>

    <script src="./app.js?v=8"></script>
</body>
</html>
