<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#d8e8ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="JOJO">
    <title>JOJO | TIMER</title>
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icon-192.png">
    <link rel="apple-touch-icon" href="../../assets/icon-192.png">
    <style>
        @font-face {
            font-family: "Archivo";
            src: url("../../assets/fonts/archivo-latin.woff2") format("woff2");
            font-weight: 500 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Inter";
            src: url("../../assets/fonts/inter-latin.woff2") format("woff2");
            font-weight: 400 800;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <link rel="stylesheet" href="../../styles/menu.css?v=8">
    <link rel="stylesheet" href="./styles.css?v=22">
</head>
<body class="menu-page menu-page--timer">
    <div class="app-shell">
        <div class="utility-dock" aria-label="Controles rápidos">
            <button id="soundToggleBtn" class="ghost-button ghost-button--pill sound-toggle utility-button" type="button" aria-pressed="true" aria-label="Som ligado">
                <img class="sound-sticker" src="../../assets/jojo-som.png" alt="" aria-hidden="true">
                <span class="sr-only">Som ligado</span>
            </button>
            <button id="fullscreenBtn" class="ghost-button ghost-button--pill utility-button" type="button" aria-label="Entrar em tela cheia">
                <span class="control-glyph control-glyph--fullscreen" aria-hidden="true"></span>
                <span class="sr-only">Entrar em tela cheia</span>
            </button>
            <button id="exitFullscreenBtn" class="ghost-button ghost-button--pill utility-button hidden" type="button" aria-label="Sair da tela cheia">
                <span aria-hidden="true">⤫</span>
                <span class="sr-only">Sair da tela cheia</span>
            </button>
        </div>

        <div id="homeScreen" class="screen screen--home">
            <div class="top-actions top-actions--home">
                <a class="brand-link" href="../../index.html" aria-label="Voltar à JOJO">
                    <img src="../../assets/jojo-horizontal.svg" alt="JOJO">
                </a>
                <div class="top-actions__group">
                    <button id="openInfoBtn" class="ghost-button ghost-button--pill utility-button" type="button" aria-label="Abrir ajuda">
                        <span aria-hidden="true">?</span>
                        <span class="sr-only">Abrir ajuda</span>
                    </button>
                </div>
            </div>

            <header class="home-hero">
                <div class="home-hero__copy">
                    <img class="home-hero__icon" src="../../assets/jojo-card-timer.png" alt="" aria-hidden="true">
                    <h1>TIMER</h1>
                </div>
            </header>

            <div class="home-workspace">
                <section class="choice-section">
                    <div class="section-heading">
                        <h2>Escolha um tipo</h2>
                    </div>
                    <div class="mode-grid">
                        <button class="mode-card mode-card--lanche mode-card--clean" type="button" data-mode="lanche">
                            <span class="mode-card__visual mode-card__visual--asset" aria-hidden="true">
                                <img src="../../assets/jojo-timer-lanche.png" alt="">
                            </span>
                            <div class="mode-card__copy">
                                <strong>Lanche</strong>
                            </div>
                        </button>

                        <button class="mode-card mode-card--casa mode-card--clean" type="button" data-mode="casa">
                            <span class="mode-card__visual mode-card__visual--asset" aria-hidden="true">
                                <img src="../../assets/jojo-timer-casa.png" alt="">
                            </span>
                            <div class="mode-card__copy">
                                <strong>Casa</strong>
                            </div>
                        </button>

                        <button class="mode-card mode-card--livre mode-card--clean" type="button" data-mode="livre">
                            <span class="mode-card__visual mode-card__visual--asset" aria-hidden="true">
                                <img src="../../assets/jojo-timer-cronometro.png" alt="">
                            </span>
                            <div class="mode-card__copy">
                                <strong>Cronômetro</strong>
                            </div>
                        </button>
                    </div>
                </section>

                <section id="setupCard" class="surface-card setup-card hidden" aria-live="polite">
                    <div class="setup-card__header">
                        <div>
                            <p id="setupEyebrow" class="eyebrow"></p>
                            <h2 id="setupTitle"></h2>
                            <p id="setupSubtitle" class="section-text"></p>
                        </div>
                        <button id="changeModeBtn" class="text-link-button" type="button">Trocar tipo</button>
                    </div>

                    <div id="durationGuidance" class="duration-guidance hidden" aria-live="polite">
                        <div class="duration-guidance__copy">
                            <span id="durationGuidanceLabel" class="duration-guidance__label"></span>
                            <strong id="durationGuidanceValue" class="duration-guidance__value"></strong>
                        </div>
                        <p id="durationGuidanceHint" class="duration-guidance__hint"></p>
                    </div>

                    <div class="input-grid">
                        <label class="time-field" for="hoursInput">
                            <span>Horas</span>
                            <input id="hoursInput" type="number" min="0" max="8" inputmode="numeric" placeholder="0">
                        </label>

                        <label class="time-field" for="minutesInput">
                            <span>Minutos</span>
                            <input id="minutesInput" type="number" min="0" max="59" inputmode="numeric" placeholder="15">
                        </label>
                    </div>

                    <div id="presetRow" class="preset-row hidden" aria-label="Atalhos de tempo">
                        <button class="preset-chip" type="button" data-preset-minutes="5">5 min</button>
                        <button class="preset-chip" type="button" data-preset-minutes="10">10 min</button>
                        <button class="preset-chip" type="button" data-preset-minutes="15">15 min</button>
                        <button class="preset-chip" type="button" data-preset-minutes="20">20 min</button>
                        <button class="preset-chip" type="button" data-preset-minutes="30">30 min</button>
                    </div>

                    <div class="preview-panel">
                        <div class="preview-panel__time">
                            <span id="timePreviewLabel" class="preview-panel__label">Tempo digitado</span>
                            <strong id="timePreview">00:15:00</strong>
                        </div>
                        <p id="validationMessage" class="preview-panel__hint"></p>
                    </div>

                    <button id="startTimerBtn" class="primary-button" type="button" disabled>Começar timer</button>
                </section>
            </div>

            <footer class="home-footer" aria-label="Créditos do timer">
                <img
                    class="home-footer__logo"
                    src="../../assets/logo-profanapixelart-small.webp"
                    alt="Logo Ana Clara Silva de Lima"
                >
                <p>Idealizado por Ana Clara Silva de Lima</p>
            </footer>
        </div>

        <div id="timerScreen" class="screen screen--timer hidden">
            <div class="top-actions top-actions--timer">
                <a class="brand-link brand-link--timer" href="../../index.html" aria-label="Voltar à JOJO">
                    <img src="../../assets/jojo-horizontal.svg" alt="JOJO">
                </a>
                <button id="backHomeBtn" class="ghost-button ghost-button--pill utility-button" type="button" aria-label="Voltar ao timer">
                    <span aria-hidden="true">←</span>
                    <span class="sr-only">Voltar ao timer</span>
                </button>
            </div>

            <header class="timer-header">
                <p id="timerModeEyebrow" class="eyebrow hidden"></p>
                <h2 id="timerModeTitle" class="hidden"></h2>
                <p id="timerStatusText" class="timer-status-text hidden"></p>
            </header>

            <section id="journeyCard" class="surface-card journey-card">
                <div class="journey-card__top">
                    <div>
                        <span class="mini-label">Tempo restante</span>
                        <strong id="countdownValue" class="countdown-value">00:15:00</strong>
                    </div>
                </div>

                <div class="journey-scene">
                    <div class="journey-track">
                        <div id="journeyMilestones" class="journey-milestones"></div>
                        <div id="journeyBasePath" class="journey-path"></div>
                        <div id="journeyProgress" class="journey-path journey-path--progress"></div>
                        <div id="studentMarker" class="student-marker">
                            <img src="./assets/crianca.webp" alt="Estudante caminhando">
                        </div>
                        <div class="destination-marker">
                            <img id="destinationAsset" src="" alt="">
                            <span id="destinationLabel"></span>
                        </div>
                    </div>
                </div>

                <div id="freeTimerPanel" class="free-timer-panel hidden" aria-live="polite">
                    <div class="hourglass-visual" aria-hidden="true">
                        <div class="hourglass-wrapper">
                            <canvas id="hourglassCanvas" class="hourglass-canvas" width="200" height="400"></canvas>
                        </div>
                    </div>
                    <div class="free-timer-panel__copy">
                        <span class="mini-label">Cronômetro livre</span>
                        <p>A ampulheta acompanha o tempo em movimento.</p>
                    </div>
                </div>

                <div class="journey-card__bottom">
                    <p id="journeyMessage" class="journey-message"></p>
                    <div class="time-split">
                        <article class="time-split__card">
                            <span class="mini-label">Já passou</span>
                            <strong id="elapsedTimeValue">00:00:00</strong>
                        </article>
                    </div>
                </div>
            </section>

            <div class="controls">
                <button id="pauseBtn" class="control-button control-button--pause" type="button"><span class="control-glyph control-glyph--pause" aria-hidden="true"></span>Pausar</button>
                <button id="resumeBtn" class="control-button control-button--resume" type="button" disabled><span class="control-glyph control-glyph--play" aria-hidden="true"></span>Continuar</button>
                <button id="resetBtn" class="control-button control-button--reset" type="button"><span class="control-glyph control-glyph--reset" aria-hidden="true"></span>Recomeçar</button>
                <button id="newTimerBtn" class="control-button control-button--back" type="button"><span class="control-glyph control-glyph--new" aria-hidden="true"></span>Novo timer</button>
            </div>
        </div>

        <div id="finishScreen" class="screen screen--finish hidden">
            <div class="finish-card">
                <p class="eyebrow">CHEGOU A HORA</p>
                <div id="finishCelebration" class="finish-card__celebration" aria-hidden="true"></div>
                <div id="finishEmoji" class="finish-card__emoji"></div>
                <div id="finishVisuals" class="finish-card__visuals hidden"></div>
                <h2 id="finishTitle"></h2>
                <p id="finishText" class="finish-card__text"></p>
                <span id="finishBadge" class="finish-card__badge"></span>
                <div class="finish-card__actions">
                    <button id="finishNewTimerBtn" class="primary-button" type="button"><span class="control-glyph control-glyph--new" aria-hidden="true"></span>Criar novo timer</button>
                    <button id="finishSameModeBtn" class="ghost-button" type="button"><span class="control-glyph control-glyph--reset" aria-hidden="true"></span>Usar o mesmo tipo</button>
                </div>
            </div>
        </div>

        <div id="infoModal" class="modal hidden" aria-hidden="true">
            <div class="modal__backdrop"></div>
            <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
                <div class="modal__header">
                    <div>
                        <p class="eyebrow">Informações</p>
                        <h2 id="infoTitle">Ajuda</h2>
                    </div>
                    <button id="closeInfoBtn" class="icon-button" type="button" aria-label="Fechar">×</button>
                </div>

                <div class="modal__content">
                    <div id="aboutParagraphs" class="about-copy"></div>
                    <ul id="aboutBullets" class="bullet-list"></ul>
                    <p id="aboutFooter" class="about-footer"></p>
                </div>
            </div>
        </div>

        <nav class="jojo-bottom-nav" aria-label="Navegação principal">
            <a class="jojo-bottom-nav__item" href="../../index.html" data-nav="home" aria-current="false">
                <img class="jojo-nav-icon" src="../../assets/jojo-nav-home.png" alt="" aria-hidden="true">
                <span class="sr-only">Início</span>
            </a>
            <a class="jojo-bottom-nav__item" href="../index.html?eixo=alfabetizacao" data-nav="jogos" aria-current="false">
                <img class="jojo-nav-icon" src="../../assets/jojo-nav-jogos.png" alt="" aria-hidden="true">
                <span class="sr-only">Jogos</span>
            </a>
            <a class="jojo-bottom-nav__item is-active" href="./index.html" data-nav="ferramentas" aria-current="page">
                <img class="jojo-nav-icon" src="../../assets/jojo-nav-ferramentas.png" alt="" aria-hidden="true">
                <span class="sr-only">Ferramentas</span>
            </a>
        </nav>
    </div>

    <script src="./data.js?v=3"></script>
    <script src="./app.js?v=18"></script>
</body>
</html>
