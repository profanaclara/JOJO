<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#dcecff">
    <title>JOJO | Timer</title>
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icon-192.png">
    <style>
        @font-face { font-family: "Archivo"; src: url("../../assets/fonts/archivo-latin.woff2") format("woff2"); font-weight: 500 800; font-display: swap; }
        @font-face { font-family: "Inter"; src: url("../../assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
    </style>
    <link rel="stylesheet" href="./styles.css?v=34">
</head>
<body>
    <main class="timer-app">
        <header class="app-header">
            <a class="round-button" href="../../" aria-label="Voltar para a plataforma">←</a>
            <img class="app-logo" src="../../assets/jojo-horizontal.svg" alt="JOJO">
            <div class="header-actions">
                <button id="soundToggleBtn" class="round-button" type="button" aria-pressed="true" aria-label="Desligar som">
                    <img src="../../assets/jojo-som.png" alt="" aria-hidden="true">
                </button>
                <button id="fullscreenBtn" class="round-button" type="button" aria-label="Entrar em tela cheia">⛶</button>
            </div>
        </header>

        <section id="homeScreen" class="screen screen--home">
            <div class="title-row">
                <div>
                    <p class="eyebrow">Ferramentas</p>
                    <h1>Timer</h1>
                </div>
                <p class="title-hint">Escolha uma rotina.</p>
            </div>

            <div class="mode-grid" aria-label="Tipos de timer">
                <button class="mode-card mode-card--lanche" type="button" data-mode="lanche">
                    <img src="../../assets/jojo-timer-lanche.png" alt="">
                    <strong>Lanche</strong>
                </button>
                <button class="mode-card mode-card--casa" type="button" data-mode="casa">
                    <img src="../../assets/jojo-timer-casa.png" alt="">
                    <strong>Casa</strong>
                </button>
                <button class="mode-card mode-card--livre" type="button" data-mode="livre">
                    <img src="../../assets/jojo-timer-cronometro.png" alt="">
                    <strong>Cronômetro</strong>
                </button>
            </div>

            <section id="setupPanel" class="setup-panel hidden" aria-live="polite">
                <div class="setup-heading">
                    <div>
                        <p class="eyebrow">Configurar</p>
                        <h2 id="setupTitle">Lanche</h2>
                    </div>
                    <button id="changeModeBtn" class="text-button" type="button">Trocar tipo</button>
                </div>
                <div class="time-fields">
                    <label>Horas<input id="hoursInput" type="number" min="0" max="8" value="0" inputmode="numeric"></label>
                    <span aria-hidden="true">:</span>
                    <label>Minutos<input id="minutesInput" type="number" min="0" max="59" value="15" inputmode="numeric"></label>
                </div>
                <div class="preset-row" aria-label="Atalhos de tempo">
                    <button type="button" data-preset="5">5 min</button>
                    <button type="button" data-preset="10">10 min</button>
                    <button type="button" data-preset="15">15 min</button>
                    <button type="button" data-preset="20">20 min</button>
                    <button type="button" data-preset="30">30 min</button>
                </div>
                <div class="setup-footer">
                    <div class="time-preview"><span>Tempo definido</span><strong id="timePreview">00:15:00</strong></div>
                    <button id="startTimerBtn" class="primary-button" type="button">Iniciar</button>
                </div>
                <p id="validationMessage" class="validation-message" role="alert"></p>
            </section>
        </section>

        <section id="timerScreen" class="screen screen--running hidden">
            <div id="journeyLayout" class="journey-running-layout hidden">
                <section id="journeyCard" class="journey-card-classic">
                    <div class="journey-card-classic__top">
                        <span class="mini-label">Tempo restante</span>
                        <strong id="journeyCountdownValue" class="journey-countdown">00:15:00</strong>
                    </div>

                    <div id="journeyScene" class="journey-scene">
                        <div class="journey-track">
                            <div id="journeyMilestones" class="journey-milestones"></div>
                            <div id="journeyBasePath" class="journey-path"></div>
                            <div id="journeyProgress" class="journey-path journey-path--progress"></div>
                            <img id="studentMarker" class="student-marker" src="./assets/crianca.webp" alt="Criança caminhando">
                            <div class="destination-marker">
                                <img id="destinationMarker" src="" alt="Destino do timer">
                            </div>
                        </div>
                    </div>

                    <article class="journey-elapsed-card">
                        <span class="mini-label">Já passou</span>
                        <strong id="journeyElapsedValue">00:00:00</strong>
                    </article>
                </section>
            </div>

            <div id="hourglassLayout" class="hourglass-running-layout hidden">
                <div class="running-bar">
                    <button id="backMenuBtn" class="round-button" type="button" aria-label="Voltar aos tipos de timer">←</button>
                    <div class="running-time">
                        <span>Tempo restante</span>
                        <strong id="countdownValue">00:15:00</strong>
                    </div>
                    <span id="runningMode" class="mode-badge">Cronômetro</span>
                </div>

                <section class="visual-stage">
                    <div id="hourglassScene" class="hourglass-scene">
                    <canvas id="hourglassCanvas" class="hourglass-canvas" width="200" height="400" aria-label="Ampulheta animada"></canvas>
                    </div>
                </section>
            </div>

            <div class="running-footer">
                <div class="elapsed-card"><span>Tempo corrido</span><strong id="elapsedValue">00:00:00</strong></div>
                <div class="controls">
                    <button id="pauseBtn" class="control-button control-button--pause" type="button">⏸ Pausar</button>
                    <button id="resumeBtn" class="control-button control-button--resume" type="button" disabled>▶ Continuar</button>
                    <button id="resetBtn" class="control-button control-button--reset" type="button">↻ Recomeçar</button>
                    <button id="newTimerBtn" class="control-button control-button--back" type="button">✨ Novo timer</button>
                </div>
            </div>
        </section>

        <section id="finishScreen" class="screen screen--finish hidden">
            <div class="finish-card">
                <img id="finishImage" src="" alt="">
                <p class="eyebrow">Tempo concluído</p>
                <h2 id="finishTitle">Hora do lanche!</h2>
                <div class="finish-actions">
                    <button id="sameModeBtn" class="primary-button" type="button">Usar o mesmo timer</button>
                    <button id="finishMenuBtn" class="control-button" type="button">Escolher outro</button>
                </div>
            </div>
        </section>
    </main>

    <script src="./data.js?v=5"></script>
    <script src="./hourglass-renderer.js?v=3"></script>
    <script src="./app.js?v=32"></script>
</body>
</html>
