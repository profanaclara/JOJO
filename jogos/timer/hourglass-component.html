<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ampulheta JOJO</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent;
        }

        .hourglass-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="hourglass-wrapper">
        <canvas id="main-canvas" width="200" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("main-canvas");
        const ctx = canvas.getContext("2d");

        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d", { willReadFrequently: true });

        const W = 200;
        const H = 400;
        canvas.width = tempCanvas.width = W;
        canvas.height = tempCanvas.height = H;

        let grid = new Uint32Array(W * H);
        const imgData = tempCtx.createImageData(W, H);
        const data32 = new Uint32Array(imgData.data.buffer);

        const CX = W / 2;
        const gateRow = H / 2;
        let totalGrainsInit = 0;
        let currentGrainsTop = 0;
        let isRunning = false;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let lastTime = 0;
        let grainsPerSecond = 0;
        let dropAccumulator = 0;

        function color(r, g, b) {
            return (255 << 24) | (b << 16) | (g << 8) | r;
        }

        function lerpColor(c1, c2, t) {
            return color(
                Math.round(c1.r + (c2.r - c1.r) * t),
                Math.round(c1.g + (c2.g - c1.g) * t),
                Math.round(c1.b + (c2.b - c1.b) * t)
            );
        }

        const colorStops = [
            { r: 255, g: 214, b: 92 },
            { r: 255, g: 188, b: 88 },
            { r: 255, g: 151, b: 109 },
            { r: 115, g: 200, b: 255 },
            { r: 93, g: 157, b: 247 },
            { r: 122, g: 110, b: 238 }
        ];

        function getGradientColor(t) {
            const clamped = Math.max(0, Math.min(1, t));
            const scaled = clamped * (colorStops.length - 1);
            const idx = Math.floor(scaled);

            if (idx >= colorStops.length - 1) {
                return color(colorStops[idx].r, colorStops[idx].g, colorStops[idx].b);
            }

            return lerpColor(colorStops[idx], colorStops[idx + 1], scaled - idx);
        }

        const glassPath = new Path2D();
        glassPath.moveTo(30, 80);
        glassPath.arc(100, 80, 70, Math.PI, 0);
        glassPath.bezierCurveTo(170, 140, 110, 180, 110, 200);
        glassPath.bezierCurveTo(110, 220, 170, 260, 170, 320);
        glassPath.arc(100, 320, 70, 0, Math.PI);
        glassPath.bezierCurveTo(30, 260, 90, 220, 90, 200);
        glassPath.bezierCurveTo(90, 180, 30, 140, 30, 80);
        glassPath.closePath();

        function buildGlassLimits() {
            grid.fill(0);

            for (let y = 0; y < H; y += 1) {
                for (let x = 0; x < W; x += 1) {
                    if (!ctx.isPointInPath(glassPath, x, y)) {
                        grid[y * W + x] = 1;
                    }
                }
            }

            for (let x = 0; x < W; x += 1) {
                if (grid[(gateRow - 1) * W + x] === 0) {
                    grid[(gateRow - 1) * W + x] = 1;
                }
                if (grid[gateRow * W + x] === 0) {
                    grid[gateRow * W + x] = 1;
                }
            }
        }

        function initLiquid() {
            buildGlassLimits();
            totalGrainsInit = 0;

            for (let y = 20; y < gateRow - 2; y += 1) {
                const colorHex = getGradientColor((y - 20) / 160);
                for (let x = 0; x < W; x += 1) {
                    if (grid[y * W + x] === 0) {
                        grid[y * W + x] = colorHex;
                        totalGrainsInit += 1;
                    }
                }
            }

            currentGrainsTop = totalGrainsInit;
        }

        function pluckGrainFromTop() {
            for (let r = 1; r < 120; r += 1) {
                for (let angle = Math.PI; angle <= Math.PI * 2; angle += 0.1) {
                    const tx = Math.round(CX + Math.cos(angle) * r);
                    const ty = Math.round((gateRow - 2) + Math.sin(angle) * r);
                    if (ty >= 0 && ty < gateRow && tx >= 0 && tx < W) {
                        if (grid[ty * W + tx] > 1) {
                            const c = grid[ty * W + tx];
                            grid[ty * W + tx] = 0;
                            return c;
                        }
                    }
                }
            }

            return 0;
        }

        function dropGrainAtBottom(c) {
            if (c <= 1) {
                return;
            }

            const sx = CX + Math.floor(Math.random() * 9) - 4;
            const sy = gateRow + 2 + Math.floor(Math.random() * 20);

            if (grid[sy * W + sx] === 0) {
                grid[sy * W + sx] = c;
            } else {
                for (let dy = sy; dy < H; dy += 1) {
                    if (grid[dy * W + CX] === 0) {
                        grid[dy * W + CX] = c;
                        break;
                    }
                }
            }
        }

        let direction = true;
        function updatePhysics() {
            direction = !direction;

            for (let y = H - 2; y >= 0; y -= 1) {
                const startX = direction ? 1 : W - 2;
                const endX = direction ? W - 1 : 0;
                const stepX = direction ? 1 : -1;

                for (let x = startX; x !== endX; x += stepX) {
                    const i = y * W + x;
                    const grain = grid[i];

                    if (grain > 1) {
                        const below = i + W;
                        if (grid[below] === 0) {
                            grid[below] = grain;
                            grid[i] = 0;
                        } else {
                            const dir = Math.random() < 0.5 ? 1 : -1;
                            if (grid[below + dir] === 0) {
                                grid[below + dir] = grain;
                                grid[i] = 0;
                            } else if (grid[below - dir] === 0) {
                                grid[below - dir] = grain;
                                grid[i] = 0;
                            } else if (grid[i + dir] === 0) {
                                grid[i + dir] = grain;
                                grid[i] = 0;
                            } else if (grid[i - dir] === 0) {
                                grid[i - dir] = grain;
                                grid[i] = 0;
                            }
                        }
                    }
                }
            }
        }

        function drawVisuals() {
            for (let i = 0; i < grid.length; i += 1) {
                data32[i] = grid[i] > 1 ? grid[i] : 0;
            }

            tempCtx.putImageData(imgData, 0, 0);
            ctx.clearRect(0, 0, W, H);

            ctx.filter = "blur(0.8px)";
            ctx.drawImage(tempCanvas, 0, 0);
            ctx.filter = "none";
            ctx.lineJoin = "round";
            ctx.lineCap = "round";

            ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
            ctx.lineWidth = 2;
            ctx.stroke(glassPath);

            const capGradient = ctx.createLinearGradient(28, 0, 172, 0);
            capGradient.addColorStop(0, "rgba(95, 224, 247, 0.92)");
            capGradient.addColorStop(0.52, "rgba(95, 157, 247, 0.96)");
            capGradient.addColorStop(1, "rgba(110, 93, 233, 0.92)");
            ctx.fillStyle = capGradient;
            fillRoundedBar(40, 56, 120, 10, 999);
            fillRoundedBar(40, 334, 120, 10, 999);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(100, 80, 50, Math.PI * 0.85, Math.PI * 1.25);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(100, 320, 50, Math.PI * 0.65, Math.PI * 0.95);
            ctx.stroke();
        }

        function fillRoundedBar(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + width, y, x + width, y + height, radius);
            ctx.arcTo(x + width, y + height, x, y + height, radius);
            ctx.arcTo(x, y + height, x, y, radius);
            ctx.arcTo(x, y, x + width, y, radius);
            ctx.closePath();
            ctx.fill();
        }

        function forceEmptyTop() {
            for (let y = 0; y < gateRow; y += 1) {
                for (let x = 0; x < W; x += 1) {
                    if (grid[y * W + x] > 1) {
                        const c = grid[y * W + x];
                        grid[y * W + x] = 0;
                        dropGrainAtBottom(c);
                    }
                }
            }
            currentGrainsTop = 0;
        }

        function mainLoop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) {
                dt = 0.016;
            }
            lastTime = timestamp;

            if (isRunning) {
                remainingSeconds -= dt;

                if (remainingSeconds <= 0) {
                    remainingSeconds = 0;
                    forceEmptyTop();
                    isRunning = false;
                } else {
                    dropAccumulator += grainsPerSecond * dt;
                    const dropsThisFrame = Math.floor(dropAccumulator);

                    if (dropsThisFrame > 0 && currentGrainsTop > 0) {
                        for (let i = 0; i < dropsThisFrame; i += 1) {
                            const c = pluckGrainFromTop();
                            if (c > 1) {
                                dropGrainAtBottom(c);
                                currentGrainsTop -= 1;
                            }
                        }
                        dropAccumulator -= dropsThisFrame;
                    }
                }
            }

            updatePhysics();
            updatePhysics();
            drawVisuals();
            window.requestAnimationFrame(mainLoop);
        }

        window.iniciarAmpulheta = function iniciarAmpulheta(m, s) {
            const tSecs = (m * 60) + s;
            if (tSecs <= 0) {
                return;
            }

            if (remainingSeconds === 0 || totalSeconds !== tSecs) {
                totalSeconds = tSecs;
                remainingSeconds = tSecs;
                initLiquid();
                grainsPerSecond = totalGrainsInit / totalSeconds;
                dropAccumulator = 0;
            }

            isRunning = true;
            lastTime = performance.now();
        };

        window.pausarAmpulheta = function pausarAmpulheta() {
            isRunning = false;
        };

        window.resetarAmpulheta = function resetarAmpulheta() {
            isRunning = false;
            remainingSeconds = 0;
            initLiquid();
        };

        initLiquid();
        window.requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
