<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f9ff">
    <title>JOJO | Jogos</title>
    <meta name="description" content="Escolha jogos educacionais de leitura, matemática, fluência e raciocínio para usar em sala de aula.">
    <link rel="canonical" href="https://jojo.profanaclara.com.br/jogos/">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="JOJO">
    <meta property="og:title" content="Jogos educacionais | JOJO">
    <meta property="og:description" content="Escolha jogos educacionais de leitura, matemática, fluência e raciocínio para usar em sala de aula.">
    <meta property="og:url" content="https://jojo.profanaclara.com.br/jogos/">
    <meta property="og:image" content="https://jojo.profanaclara.com.br/assets/jojo-social-share.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=1">
    <link rel="apple-touch-icon" href="../assets/icon-192.png">
    <style>
        @font-face {
            font-family: "Archivo";
            src: url("../assets/fonts/archivo-latin.woff2") format("woff2");
            font-weight: 500 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Inter";
            src: url("../assets/fonts/inter-latin.woff2") format("woff2");
            font-weight: 400 800;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <link rel="stylesheet" href="../styles/main.css?v=17">
    <link rel="stylesheet" href="../styles/menu.css?v=8">
    <link rel="stylesheet" href="./jogos.css?v=5">
</head>
<body class="jogos-hub-page">
    <div class="jogos-shell">
        <header class="jogos-header">
            <a class="jogos-back" href="../index.html" aria-label="Voltar ao início">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
            </a>
            <img src="../assets/jojo-horizontal.svg" alt="JOJO">
            <span></span>
        </header>

        <main class="jogos-main">
            <section class="jogos-intro" aria-labelledby="jogosTitle">
                <h1 id="jogosTitle">Jogos</h1>
                <p>Escolha um eixo para começar.</p>
            </section>

            <div class="eixos-tabs" role="tablist" aria-label="Eixos de jogos">
                <button class="eixo-tab is-active" type="button" data-eixo="alfabetizacao" role="tab" aria-selected="true" aria-label="Alfabetização">
                    <img src="../assets/jojo-eixo-alfabetizacao.png" alt="" aria-hidden="true">
                </button>
                <button class="eixo-tab" type="button" data-eixo="matematica" role="tab" aria-selected="false" aria-label="Matemática">
                    <img src="../assets/jojo-eixo-matematica.png" alt="" aria-hidden="true">
                </button>
                <button class="eixo-tab" type="button" data-eixo="geometria" role="tab" aria-selected="false" aria-label="Geometria">
                    <img src="../assets/jojo-eixo-geometria.png" alt="" aria-hidden="true">
                </button>
            </div>

            <section id="jogosGrid" class="jogos-grid" aria-live="polite"></section>
        </main>

    </div>

    <script src="./jogos.data.js?v=11"></script>
    <script src="./jogos.js?v=8"></script>
</body>
</html>
