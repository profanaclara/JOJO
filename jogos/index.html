<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f9ff">
    <title>JOJO | Jogos</title>
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
    <style>
        @font-face {
            font-family: "Archivo";
            src: url("../assets/fonts/archivo-latin.woff2") format("woff2");
            font-weight: 500 800;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Inter";
            src: url("../assets/fonts/inter-latin.woff2") format("woff2");
            font-weight: 400 800;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <link rel="stylesheet" href="../styles/main.css?v=16">
    <link rel="stylesheet" href="../styles/menu.css?v=8">
    <link rel="stylesheet" href="./jogos.css?v=4">
</head>
<body class="jogos-hub-page">
    <div class="jogos-shell">
        <header class="jogos-header">
            <a class="jogos-back" href="../index.html" aria-label="Voltar ao início">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
            </a>
            <img src="../assets/jojo-horizontal.svg" alt="JOJO">
            <span></span>
        </header>

        <main class="jogos-main">
            <section class="jogos-intro" aria-labelledby="jogosTitle">
                <h1 id="jogosTitle">Jogos</h1>
                <p>Escolha um eixo para começar.</p>
            </section>

            <div class="eixos-tabs" role="tablist" aria-label="Eixos de jogos">
                <button class="eixo-tab is-active" type="button" data-eixo="alfabetizacao" role="tab" aria-selected="true" aria-label="Alfabetização">
                    <img src="../assets/jojo-eixo-alfabetizacao.png" alt="" aria-hidden="true">
                </button>
                <button class="eixo-tab" type="button" data-eixo="matematica" role="tab" aria-selected="false" aria-label="Matemática">
                    <img src="../assets/jojo-eixo-matematica.png" alt="" aria-hidden="true">
                </button>
                <button class="eixo-tab" type="button" data-eixo="geometria" role="tab" aria-selected="false" aria-label="Geometria">
                    <img src="../assets/jojo-eixo-geometria.png" alt="" aria-hidden="true">
                </button>
            </div>

            <section id="jogosGrid" class="jogos-grid" aria-live="polite"></section>
        </main>

        <div id="panelBackdrop" class="panel-backdrop hidden"></div>
        <section id="infoPanel" class="info-panel" aria-hidden="true" aria-labelledby="panelTitle">
            <div class="sheet-handle" aria-hidden="true"></div>
            <header class="info-panel__header">
                <div>
                    <p>JOJO</p>
                    <h2 id="panelTitle">Ferramentas</h2>
                </div>
                <button id="panelCloseBtn" class="icon-button" type="button" aria-label="Fechar painel">×</button>
            </header>
            <p id="panelDescription" class="info-panel__description">Atalhos rápidos para organizar a aula.</p>
            <div id="panelContent" class="info-panel__content"></div>
        </section>

        <nav class="jojo-bottom-nav" aria-label="Navegação principal">
            <a class="jojo-bottom-nav__item" href="../index.html" data-nav="home" aria-label="Início" aria-current="false">
                <img class="jojo-nav-icon" src="../assets/jojo-nav-home.png" alt="" aria-hidden="true">
                <span class="sr-only">Início</span>
            </a>
            <button class="jojo-bottom-nav__item is-active" type="button" data-nav="jogos" aria-label="Jogos" aria-current="page">
                <img class="jojo-nav-icon" src="../assets/jojo-nav-jogos.png" alt="" aria-hidden="true">
                <span class="sr-only">Jogos</span>
            </button>
            <a class="jojo-bottom-nav__item" href="./timer/index.html" data-nav="ferramentas" aria-label="Ferramentas" aria-current="false">
                <img class="jojo-nav-icon" src="../assets/jojo-nav-ferramentas.png" alt="" aria-hidden="true">
                <span class="sr-only">Ferramentas</span>
            </a>
        </nav>
    </div>

    <script src="./jogos.data.js?v=7"></script>
    <script src="./jogos.js?v=7"></script>
</body>
</html>
